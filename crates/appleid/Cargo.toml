[package]
name = "wirdrop-appleid"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Signs a Windows PC in to an Apple ID for AirDrop and keeps it signed in: Apple's sign-in, the AirDrop certificate, the iCloud contacts"
repository = "https://github.com/JungyoKim/WirDrop"
publish = false

[[bin]]
name = "appleid"
path = "src/main.rs"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
num-bigint = "0.4"
pbkdf2 = "0.12"
plist = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
rsa = { version = "0.9", features = ["sha2"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Time",
] }

