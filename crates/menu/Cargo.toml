[package]
name = "wirdrop-menu"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "WinUI 3's Fluent context menu for a notification-area icon, shown from a XAML island"
repository = "https://github.com/JungyoKim/WirDrop"
publish = false

[dependencies]
# The versions windows-reactor uses, so the two share them. bindings.rs needs no more: see gen/.
windows-core = "0.100"
windows-collections = { version = "0.100", default-features = false, features = ["std"] }
windows-future = { version = "0.100", default-features = false }
windows-numerics = { version = "0.100", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# examples/demo.rs: the GPU preference the tray app sets.
windows-registry = "0.6"

