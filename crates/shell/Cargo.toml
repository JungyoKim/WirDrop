[package]
name = "wirdrop-shell"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AirDrop in the Windows 11 File Explorer menu: an IExplorerCommand for WirDrop"
repository = "https://github.com/JungyoKim/WirDrop"
publish = false

[lib]
name = "wirdrop_shell"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

