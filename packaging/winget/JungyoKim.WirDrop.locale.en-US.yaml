ShortDescription: AirDrop files between Windows 11 and an iPhone or iPad.
Description: |-
  Right-click a file in Explorer to send it to an iPhone or iPad, and pick this PC in the iPhone's
  share sheet to receive. WirDrop drives AirDrop's Wi-Fi link (AWDL) on a USB Wi-Fi adapter, so it
  needs a supported one such as the TP-Link Archer T3U Nano (Realtek RTL8812BU). It installs no
  kernel driver.
